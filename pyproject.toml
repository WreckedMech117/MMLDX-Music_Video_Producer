[project]
name = "music-video-producer"
version = "0.1.0"
description = "Local-first AI music video production studio backed by ComfyUI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "python-multipart>=0.0.20",
  "uvicorn>=0.40",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_video_producer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Vendored agent tooling, not this project's source. Excluded so `ruff check .`
# remains a meaningful gate on application code.
extend-exclude = [".claude", "_bmad", "_bmad-output"]
