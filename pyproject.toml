[project]
name = "music-video-producer"
version = "0.1.0"
description = "Local-first AI music video production studio backed by ComfyUI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128",
  "faster-whisper>=1.2.1",
  "httpx>=0.28",
  # Declared rather than added: it is already resolved and locked transitively through
  # faster-whisper, and `audio.py` imports it directly. Naming it here makes an existing fact
  # honest — an undeclared dependency this application imports is one `uv sync` away from
  # vanishing when the package that happens to pull it in changes its own requirements.
  "numpy>=1.26",
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "python-multipart>=0.0.20",
  "uvicorn>=0.40",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_video_producer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Vendored agent tooling, not this project's source. Excluded so `ruff check .`
# remains a meaningful gate on application code.
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[tool.ruff.lint]
# The one rule that would have seen `create_app` coming, chosen from measurement rather than
# from taste. An empty `select` means ruff 0.16.3's defaults -- which are far wider than the
# `E4,E7,E9,F` the retrospective assumed (`I001`, `B006`, `S110` and `BLE001` all fire without
# being asked for, and this split had to satisfy every one of them) but contain no complexity
# or size rule at all. That is how a factory function reached 7,882 lines with the gate green
# the whole way.
#
# `C901` is the only default-off rule in this version that fires on the shape this repository
# grows in. Measured on `create_app` across its own history: 78 at `3325eee` (2026-08-16), 594
# at `9674aaa` the commit before this split, 342 after it. Everything else in the tree is an
# order below: `routes/unsorted.py`'s `register` at 83, `routes/shots.py`'s at 71, and the
# longest test script at 48. A statement count (`PLR0915`) cannot be used instead -- the
# largest function in this repository by statements is a 740-statement end-to-end browser
# script, so any threshold that spares it would spare anything.
#
# 400 sits between what the split achieved and what it removed: seventeen per cent of headroom
# on `create_app` as it now stands, and well under the 594 it carried a day ago. It says the
# next epic may not give back more than about a fifth of the ground this split gained, and it
# needs no per-file carve-out for the file it is really about -- which would have been the
# theatrical version of this rule.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 300
# Corrected 2026-08-28: the prose above argues for 400 and the value is 300.
# 300 is what `e6f6b23` set and what has held since; the argument was not updated with it.
# Measured 2026-08-28, so the next reader does not re-derive it: this gate binds on exactly
# one thing in the repository, `create_app` at 264. `effects.py`'s worst function is 14.
# **Nothing here constrains length at all** -- a 4,081-line module and a 25,000-line test
# file are invisible to every gate, which is what Epic 10's retrospective found when it went
# looking for a second god-class.
